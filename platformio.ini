; Optional PlatformIO build. The project is primarily an Arduino IDE sketch
; (see README.md); this file lets the same tree build from the CLI without
; changing a single source file.
;
;   pio run              build
;   pio run -t upload    flash
;   pio device monitor   serial monitor at 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; The Arduino sketch folder is the source root.
src_dir = SolarSense

lib_deps =
    claws/BH1750@^1.3.0
    adafruit/Adafruit INA219@^1.2.3
    adafruit/RTClib@^2.1.4
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.6
    adafruit/DHT sensor library@^1.4.7
    adafruit/Adafruit Unified Sensor@^1.1.15

build_flags =
    -Wall
